info:
  name: Fetch Seek Job
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/jobs/search/seek"
  body:
    type: json
    data: |-
      {
        "keywords": "software engineer",
        "where": "South Australia SA"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
