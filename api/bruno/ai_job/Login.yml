info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "seeker@shawnl.dev",
        "password": "Test123$"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: TOKEN
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.user.id
        method: jsonq
      variable:
        name: USER_ID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
